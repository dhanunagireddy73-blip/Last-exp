<!DOCTYPE html>
<html>
<head>
    <title>Sridevi, My Love</title>
    <style>
        body {
            background-image: linear-gradient(to bottom, #ffcccc, #ffe6e6);
            font-family: Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .love-message {
            text-align: center;
            font-size: 24px;
            color: #ff69b4;
        }
        .love-message h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .heart {
            color: #ff0000;
            font-size: 48px;
        }
    </style>
</head>
<body>
    <div class="love-message">
        <h1>Sridevi, My Love</h1>
        <p>You are the sunshine that brightens up my day.</p>
        <p class="heart">&hearts;</p>
        <p>Forever and always, my love for you will grow.</p>
    </div>
</body>
</html>
